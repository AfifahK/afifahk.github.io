name: Update last-updated date

on:
  push:
    branches: [main]

jobs:
  update-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update last-updated date in index.html
        run: |
          MONTH_YEAR=$(date -u +'%b %Y')
          sed -i "s|Last updated [A-Z][a-z]\{2\} [0-9]\{4\}|Last updated ${MONTH_YEAR}|g" index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet index.html || (git add index.html && git commit -m "chore: update last-updated date to $(date -u +'%b %Y')" && git push)
